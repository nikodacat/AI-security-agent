    - banner        : analyzer probe library (httpd -v, INFO server, etc.)
    - probe-fs      : filesystem-existence probe (find / -name log4j*.jar)
    - network       : v2 network-prober external reachability check

  SSH-not-installed entries use NO_EVIDENCE per the 2026-08-05 revision-
  log decision -- "no ssh binary in PATH" is not positive absence proof;
  a stronger dpkg + filesystem-negative probe would justify NOT_RUNNING.

  Two aspirational-doc entries are intentionally NOT scored here:
