# Machine-readable ground-truth sidecar for run_eval.py.
#
# Source of truth is the narrative in ground_truth.md -- this file is
# a mechanical extraction of the tables there. When they disagree, the
# markdown wins; regenerate this file from it.
#
# Any expected_verdict change here must ALSO be logged in the revision
# log at the bottom of ground_truth.md (the audit-trail lives there).

version: 2
committed_at: 2026-08-10
scoring_scope: v1-pipeline-surfaceable
note: |
  v2 rescope (see 2026-08-10 revision log in ground_truth.md).
  This YAML scores what the current v1 pipeline can actually surface --
  the intersection of {CISA KEV catalog} ∩ {dpkg-installed packages}
  on each container. The larger 17-entry aspirational ground truth
  (banner-detected Apache, non-dpkg log4j, source-built httpd, absent
  SSH) is preserved in the markdown as documented v2 coverage targets
  and is NOT scored by run_eval.py at this stage.

  Every v1-scored entry is a KEV+dpkg CVE where the installed package
  version is POST-FIX, so the schema-correct verdict is
  MITIGATED_BY_CONFIG (the "config" being the choice of patched
  version). This measures the analyzer's ability to correctly
  recognize a patched CVE, which is where the pipeline sits today.

containers:
  eval-web-vuln:
    - {cve_id: CVE-2014-0160, expected: MITIGATED_BY_CONFIG, software: openssl,     detection: dpkg, note: "libssl1.1 1.1.1n-0+deb10u6, Heartbleed fixed in 1.0.1g"}
    - {cve_id: CVE-2014-6278, expected: MITIGATED_BY_CONFIG, software: bash,        detection: dpkg, note: "bash 5.0-4, Shellshock family fixed in bash 4.3 patchlevels"}

  eval-db-exposed:
    - {cve_id: CVE-2014-0160, expected: MITIGATED_BY_CONFIG, software: openssl,     detection: dpkg, note: "libssl1.1 1.1.1w-0+deb11u8, Heartbleed fixed in 1.0.1g"}
    - {cve_id: CVE-2014-6278, expected: MITIGATED_BY_CONFIG, software: bash,        detection: dpkg, note: "bash 5.1-2+b3, Shellshock family fixed in bash 4.3 patchlevels"}

  eval-cms-plugin:
    - {cve_id: CVE-2014-0160, expected: MITIGATED_BY_CONFIG, software: openssl,     detection: dpkg, note: "libssl1.1 1.1.1d-0+deb10u6, Heartbleed fixed in 1.0.1g"}
    - {cve_id: CVE-2014-6278, expected: MITIGATED_BY_CONFIG, software: bash,        detection: dpkg, note: "bash 5.0-4, Shellshock family fixed in bash 4.3 patchlevels"}
    - {cve_id: CVE-2017-8291, expected: MITIGATED_BY_CONFIG, software: ghostscript, detection: dpkg, note: "ghostscript 9.27~dfsg-2+deb10u4, fix landed in 9.21"}
